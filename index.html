<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微云充 · 智能监控</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F2F5FA">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #F0F4F8 0%, #E8EDF5 50%, #F5F7FA 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.05);
            
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --text-tertiary: #AEAEB2;

            --apple-green: #34C759;
            --apple-green-light: rgba(52, 199, 89, 0.12);
            --apple-green-glow: rgba(52, 199, 89, 0.28);
            
            --apple-gray-busy: #F2F2F7;
            --apple-gray-txt: #8E8E93;
            --apple-blue: #007AFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            padding: calc(env(safe-area-inset-top, 20px) + 12px) 16px calc(env(safe-area-inset-bottom, 20px) + 20px);
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(52, 199, 89, 0.15) 0%, rgba(0, 122, 255, 0.08) 50%, transparent 70%);
            top: -60px;
            right: -60px;
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 18px;
            padding: 0 4px;
        }
        .header-title-box h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .creator-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 122, 255, 0.08);
            color: var(--apple-blue);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 12px;
            margin-bottom: 5px;
            border: 1px solid rgba(0, 122, 255, 0.15);
        }
        .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--apple-blue);
        }
        .refresh-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--apple-blue);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.08);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s ease;
        }
        .refresh-pill:active {
            transform: scale(0.94);
        }

        .hero-metric-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .metric-info h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 6px;
        }
        .metric-num-wrap {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .huge-num {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--apple-green);
        }
        .huge-unit {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .metric-sub {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        .ring-container {
            position: relative;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ring-svg {
            transform: rotate(-90deg);
        }
        .ring-circle-bg {
            fill: none;
            stroke: #E5E5EA;
            stroke-width: 7;
        }
        .ring-circle-fill {
            fill: none;
            stroke: var(--apple-green);
            stroke-width: 7;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ring-percent {
            position: absolute;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .section-tag {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .device-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--glass-shadow);
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .dev-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dev-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .dev-badge-no {
            background: rgba(142, 142, 147, 0.12);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 6px;
        }
        .dev-status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-badge-free {
            background: var(--apple-green-light);
            color: var(--apple-green);
        }
        .status-badge-busy {
            background: var(--apple-gray-busy);
            color: var(--apple-gray-txt);
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .dot-green {
            background: var(--apple-green);
            box-shadow: 0 0 6px var(--apple-green);
        }
        .dot-gray {
            background: #C7C7CC;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .slot-btn {
            background: var(--apple-gray-busy);
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            border: 1px solid transparent;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .slot-free {
            background: #FFFFFF;
            border-color: rgba(52, 199, 89, 0.45);
            box-shadow: 0 4px 14px var(--apple-green-glow);
            cursor: pointer;
        }
        .slot-free:active {
            transform: scale(0.92);
        }
        .slot-num {
            font-size: 16px;
            font-weight: 700;
            color: #8E8E93;
        }
        .slot-free .slot-num {
            color: var(--apple-green);
        }
        .slot-label {
            font-size: 11px;
            margin-top: 2px;
            font-weight: 600;
            color: #AEAEB2;
        }
        .slot-free .slot-label {
            color: var(--apple-green);
        }

        .app-footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 24px;
            padding-bottom: 12px;
            line-height: 1.6;
        }
        .app-footer strong {
            color: var(--text-secondary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="main-wrapper">
        <header>
            <div class="header-title-box">
                <div class="creator-badge">
                    <span class="badge-dot"></span>
                    <span>开发者 · 日月潭</span>
                </div>
                <h1>常州大学西太湖校区</h1>
            </div>
            <button class="refresh-pill" onclick="fetchLiveStatus()">
                <span id="refresh-icon">🔄</span>
                <span id="update-time">--:--:--</span>
            </button>
        </header>

        <div class="hero-metric-card">
            <div class="metric-info">
                <h2>当前全区可用车位</h2>
                <div class="metric-num-wrap">
                    <span class="huge-num" id="free-total">--</span>
                    <span class="huge-unit">/ <span id="total-slots">40</span> 孔可用</span>
                </div>
                <div class="metric-sub" id="status-hint">正在拉取最新状态...</div>
            </div>
            <div class="ring-container">
                <svg class="ring-svg" width="76" height="76">
                    <circle class="ring-circle-bg" cx="38" cy="38" r="30"></circle>
                    <circle class="ring-circle-fill" id="ring-fill" cx="38" cy="38" r="30" stroke-dasharray="188.4" stroke-dashoffset="188.4"></circle>
                </svg>
                <div class="ring-percent" id="ring-txt">--%</div>
            </div>
        </div>

        <div class="section-header">
            <span class="section-title">机台插孔详情 (0 ~ 9 号)</span>
            <span class="section-tag">绿灯即为空位，速充</span>
        </div>

        <div id="devices-container"></div>

        <footer class="app-footer">
            常州大学西太湖校区 · 微云充智能监控系统 (Android 独立版)<br>
            Designed & Developed by <strong>日月潭</strong> · 直连官方数据
        </footer>
    </div>

    <script>
        const API_URL = "https://saas.laichon.com/api/app/ebike/getDeviceInfo";
        const HEADERS = {
            "openid": "oOO3c4op_7fkh8C4-q0mFnbn-uIQ",
            "authorization": "bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczpcL1wvbW9iaWxlLmxhaWNob24uY29tIiwiaWF0IjoxNzkyNjY5NTUwLCJleHAiOjE3OTM5NjU1NTAsInN1YiI6MzI4ODk1NzEsInJvbGUiOiJ1c2VyIiwibW9uaXRvcl91c2VyX2lkIjoiN2YyZjM4YTViMzJkNzIwNGRhMzM4YzI0MzEyMDNmZjciLCJqdGkiOjk3MTg2MDI5NTU5NTg1NTg3MiwibmJmIjoxNzkyNjY5NTUwfQ==.Lnj6H-Lv4xt_QH4fDXgmwkPgYJM-P1TbBsQYRD8bPc8=",
            "service-code": "WYC-MI-WEIXIN",
            "content-type": "application/json"
        };

        const devices = [
            {"name": "1号机", "device_no": "L32022884"},
            {"name": "2号机", "device_no": "L32022881"},
            {"name": "3号机", "device_no": "L32022883"},
            {"name": "4号机", "device_no": "L32022882"}
        ];

        let isRefreshing = false;

        async function fetchSingleDevice(dev) {
            try {
                const resp = await fetch(API_URL, {
                    method: "POST",
                    headers: HEADERS,
                    body: JSON.stringify({"device_no": dev.device_no})
                });
                const res = await resp.json();
                const guns = (res.data && res.data.device_gunpoint) ? res.data.device_gunpoint : [];
                const guns_status = guns.map(g => ({
                    gun_no: g.gun_no,
                    is_free: (g.gun_status === 0)
                }));
                const freeCount = guns_status.filter(g => g.is_free).length;
                return {
                    name: dev.name,
                    device_no: dev.device_no,
                    total: guns_status.length,
                    free: freeCount,
                    guns: guns_status
                };
            } catch (e) {
                return {
                    name: dev.name,
                    device_no: dev.device_no,
                    total: 10,
                    free: 0,
                    guns: []
                };
            }
        }

        async function fetchLiveStatus() {
            if (isRefreshing) return;
            isRefreshing = true;
            const icon = document.getElementById("refresh-icon");
            icon.style.transition = "transform 0.6s ease";
            icon.style.transform = "rotate(360deg)";

            const now = new Date();
            const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');

            try {
                const results = await Promise.all(devices.map(d => fetchSingleDevice(d)));
                let totalAll = 0;
                let freeAll = 0;
                results.forEach(r => {
                    totalAll += r.total;
                    freeAll += r.free;
                });

                document.getElementById("update-time").innerText = timeStr;
                document.getElementById("free-total").innerText = freeAll;
                document.getElementById("total-slots").innerText = totalAll;

                const hintElem = document.getElementById("status-hint");
                if (freeAll > 0) {
                    hintElem.innerHTML = `🟢 发现 <strong>${freeAll}</strong> 个空位，可直接带充电器前往`;
                    hintElem.style.color = "var(--apple-green)";
                } else {
                    hintElem.innerHTML = `🈵 全区插孔已占满，建议稍后刷新捡漏`;
                    hintElem.style.color = "var(--apple-gray-txt)";
                }

                const freeRate = totalAll > 0 ? (freeAll / totalAll) : 0;
                const circumference = 2 * Math.PI * 30;
                const offset = circumference - (freeRate * circumference);
                document.getElementById("ring-fill").style.strokeDashoffset = offset;
                document.getElementById("ring-txt").innerText = Math.round(freeRate * 100) + "%";

                const container = document.getElementById("devices-container");
                container.innerHTML = "";

                results.forEach(dev => {
                    const isFree = dev.free > 0;
                    const card = document.createElement("div");
                    card.className = "device-card";

                    let slotsHtml = "";
                    dev.guns.forEach(g => {
                        if (g.is_free) {
                            slotsHtml += `
                                <div class="slot-btn slot-free" onclick="alert('已为你锁定：${dev.name} 的【${g.gun_no}号孔】为空闲状态！')">
                                    <div class="slot-num">${g.gun_no}号</div>
                                    <div class="slot-label">空闲</div>
                                </div>
                            `;
                        } else {
                            slotsHtml += `
                                <div class="slot-btn">
                                    <div class="slot-num">${g.gun_no}号</div>
                                    <div class="slot-label">占用</div>
                                </div>
                            `;
                        }
                    });

                    card.innerHTML = `
                        <div class="device-header">
                            <div class="dev-title-wrap">
                                <span class="dev-name">${dev.name}</span>
                                <span class="dev-badge-no">${dev.device_no}</span>
                            </div>
                            <div class="dev-status-badge ${isFree ? 'status-badge-free' : 'status-badge-busy'}">
                                <span class="status-dot ${isFree ? 'dot-green' : 'dot-gray'}"></span>
                                <span>${isFree ? `空闲 ${dev.free} 个孔` : '满载充电'}</span>
                            </div>
                        </div>
                        <div class="slots-grid">
                            ${slotsHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

                if (navigator.vibrate) navigator.vibrate(25);
            } finally {
                setTimeout(() => {
                    icon.style.transform = "rotate(0deg)";
                    isRefreshing = false;
                }, 600);
            }
        }

        fetchLiveStatus();
        setInterval(fetchLiveStatus, 20000);
    </script>
</body>
</html>
